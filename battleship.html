<!DOCTYPE html>
<html>
<head>
    <title>Battleship Game</title>
    <style>
        .canvasContainer {
            display: flex;
        }

        .canvasGroup {
            text-align: center;
            margin-left: 70px;
        }
        
        canvas {
            border: 1px solid black;
        }

        button {
            width: 150px; 
            height: 40px; 
            font-size: 16px; 
        }

        .buttonContainer {
            margin-left: 60px;
            margin-top: 65px;
        }
        .square {
            width: 50px; /* Adjust width as needed */
            height: 50px; /* Adjust height as needed */
            background-color: palegreen; /* Background color */
            border: 2px solid black; /* Border color and width */
            padding: 20px; /* Padding inside the box */
            box-sizing: border-box; /* Include border and padding in total width/height */
        }
    </style>
</head>
<body>  
    <div class="canvasContainer">
        <div class="canvasGroup">
            <h2>Enemy Ships</h2>
            <canvas id="battleshipCanvas" width="500" height="500"></canvas>
        </div>
        
        <div class="canvasGroup" id="shipCanvas">
            <h2>My Ships</h2>
            <canvas id="myBattleshipCanvas" width="500" height="500"></canvas>
        </div>

        <div class="buttonContainer">
            <button id="btnStart">Start Game</button>
            <button id="btnNew">New Game</button>
            <h3 id="myhits">Hits: 0/5</h3>
            <h3 id="mymiss">Missed:</h3>
            <div class="square" id="ship" draggable="true"></div>
        </div>
        
       
    </div>

    <script src="battleship.js"></script>
</body>
</html>
